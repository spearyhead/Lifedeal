<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Deal</title>
<meta name="theme-color" content="#6C4DF6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life Deal">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%236C4DF6'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='Georgia' font-weight='900'%3ELD%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F3FB; --card: #FFFFFF; --card2: #ECE9FA; --ink: #1E1B33; --soft: #5E5A7A; --faint: #8C88A8; --line: #DDD9F0;
    --primary: #6C4DF6; --primary-ink: #FFFFFF; --coral: #FF6B6B; --teal: #14A99A; --gold: #F5B83D; --good: #18A66B; --bad: #E5484D;
    --health: #2DBE7E; --happy: #F5B83D; --smarts: #4C8DF6; --charm: #E85DA8;
    --font-display: 'Fraunces', Georgia, serif; --font-body: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    --shadow: 0 2px 0 rgba(30,27,51,0.06), 0 10px 24px -12px rgba(30,27,51,0.25);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13112B; --card: #1F1C3E; --card2: #2A2650; --ink: #F1EEFF; --soft: #B4AFD6; --faint: #837EA8; --line: #36315F;
      --primary: #8C73FF; --coral: #FF8585; --teal: #3CCDBE; --gold: #F7C65C; --good: #3FD08F; --bad: #FF7075;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13112B; --card: #1F1C3E; --card2: #2A2650; --ink: #F1EEFF; --soft: #B4AFD6; --faint: #837EA8; --line: #36315F;
    --primary: #8C73FF; --coral: #FF8585; --teal: #3CCDBE; --gold: #F7C65C; --good: #3FD08F; --bad: #FF7075;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); display: flex; justify-content: center; overscroll-behavior: none; }
  button { font-family: var(--font-body); cursor: pointer; }
  .app { width: 100%; max-width: 460px; height: 100vh; height: 100dvh; display: flex; flex-direction: column; position: relative; }
  .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .view.active { display: flex; }

  .btn { border: 2px solid transparent; border-radius: 14px; padding: 13px 16px; font-weight: 700; font-size: 15px; width: 100%; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: var(--primary-ink); box-shadow: 0 3px 0 rgba(0,0,0,0.25); }
  .btn-primary:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }
  .btn-ghost { background: var(--card); color: var(--ink); border-color: var(--line); }
  .btn-coral { background: var(--coral); color: #2A0A0A; box-shadow: 0 3px 0 rgba(0,0,0,0.2); }
  .btn-small { padding: 8px 12px; font-size: 13px; width: auto; border-radius: 10px; }

  /* title */
  .title-wrap { padding: 22px 18px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .logo { font-family: var(--font-display); font-weight: 900; font-size: 38px; line-height: 1; }
  .logo em { color: var(--primary); font-style: italic; }
  .tag { color: var(--soft); font-size: 15px; line-height: 1.5; margin: 0; }
  .label { font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; }
  .chips { display: flex; gap: 8px; }
  .chip { flex: 1; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 6px; color: var(--ink); font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .chip .em { font-size: 26px; }
  .chip .ds { font-size: 10.5px; color: var(--faint); font-weight: 500; text-align: center; line-height: 1.25; }
  .chip.sel { border-color: var(--primary); background: var(--card2); }
  input.name { width: 100%; border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 14px; padding: 12px 14px; font-size: 16px; font-family: var(--font-body); }
  .mini-stats { display: flex; gap: 8px; font-size: 12px; color: var(--soft); }
  .mini-stats b { color: var(--ink); }

  /* head */
  .head { padding: 10px 14px 6px; display: flex; flex-direction: column; gap: 8px; }
  .head-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .who .nm { font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .sb { font-size: 12px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nw { text-align: right; }
  .nw .v { font-family: var(--font-display); font-weight: 900; font-size: 22px; }
  .nw .l { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; }
  .nw .c { font-size: 12px; color: var(--soft); }
  .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .bar-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--soft); }
  .bar-row .ic { width: 16px; }
  .bar-track { flex: 1; height: 7px; border-radius: 5px; background: var(--card2); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 5px; transition: width .5s ease; }
  .bar-row b { width: 22px; text-align: right; color: var(--ink); font-weight: 700; }
  .goal { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; font-size: 12px; color: var(--soft); display: none; }
  .goal.on { display: block; }
  .goal .gb { height: 6px; background: var(--card2); border-radius: 4px; margin-top: 5px; overflow: hidden; }
  .goal .gf { height: 100%; background: linear-gradient(90deg, var(--gold), var(--coral)); border-radius: 4px; transition: width .5s ease; }
  .goal b { color: var(--ink); }

  /* feed */
  .feed { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 12px 14px; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
  .yr { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-family: var(--font-display); font-weight: 700; font-size: 15px; }
  .yr .a { background: var(--primary); color: var(--primary-ink); border-radius: 999px; padding: 3px 12px; font-size: 13px; }
  .yr .w { font-size: 12px; color: var(--faint); font-family: var(--font-body); font-weight: 500; }
  .fi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; box-shadow: var(--shadow); animation: pop .3s ease; }
  .fi.good { border-left: 4px solid var(--good); } .fi.bad { border-left: 4px solid var(--bad); } .fi.gold { border-left: 4px solid var(--gold); background: var(--card2); }
  .fi b { font-weight: 700; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }

  /* dock */
  .dock { display: grid; grid-template-columns: 1fr 1fr 1.5fr 1fr 1fr; gap: 6px; padding: 8px 10px 10px; background: var(--bg); border-top: 1px solid var(--line); }
  .dock button { background: var(--card); border: 1px solid var(--line); border-radius: 14px; color: var(--ink); font-size: 11px; font-weight: 600; padding: 7px 2px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .dock button .ic { font-size: 19px; }
  .dock button:disabled { opacity: 0.4; }
  .dock .age { background: var(--primary); color: var(--primary-ink); border: none; font-size: 14px; font-weight: 800; box-shadow: 0 3px 0 rgba(0,0,0,0.25); }
  .dock .age:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }
  .dock .age .ic { font-size: 20px; }

  /* overlays */
  .ov { position: fixed; inset: 0; display: none; justify-content: center; align-items: center; background: rgba(12, 9, 34, 0.6); z-index: 30; padding: 14px; }
  .ov.on { display: flex; animation: fade .2s ease; }
  .ov.sheet-ov { align-items: flex-end; padding: 0; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal { width: 100%; max-width: 420px; background: var(--card); border-radius: 22px; padding: 20px 18px; box-shadow: var(--shadow); max-height: 92%; overflow-y: auto; animation: pop .25s ease; }
  .modal .em { font-size: 40px; line-height: 1; }
  .modal h2 { font-family: var(--font-display); font-size: 22px; margin: 8px 0 4px; }
  .modal p { margin: 0 0 12px; color: var(--soft); font-size: 14.5px; line-height: 1.5; }
  .choices { display: flex; flex-direction: column; gap: 8px; }
  .choice { background: var(--card2); border: 2px solid transparent; border-radius: 14px; padding: 12px 14px; text-align: left; color: var(--ink); }
  .choice:active { border-color: var(--primary); }
  .choice .t { font-weight: 700; font-size: 14.5px; }
  .choice .s { font-size: 12px; color: var(--soft); margin-top: 2px; }
  .delta { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
  .dchip { font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--card2); }
  .dchip.pos { color: var(--good); } .dchip.neg { color: var(--bad); }

  .sheet { width: 100%; max-width: 460px; height: 88%; background: var(--bg); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up .25s ease; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
  .sheet-head h2 { font-family: var(--font-display); font-size: 22px; margin: 0; }
  .x { background: var(--card2); border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 16px; color: var(--ink); }
  .sheet-body { flex: 1; overflow-y: auto; padding: 6px 14px 20px; display: flex; flex-direction: column; gap: 10px; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 2px; font-size: 12px; font-weight: 600; color: var(--soft); }
  .seg button.sel { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); }
  .listing { border-left: 5px solid var(--rc, var(--line)); }
  .l-top { display: flex; align-items: center; gap: 10px; }
  .l-top .e { font-size: 28px; }
  .l-top .n { flex: 1; min-width: 0; }
  .l-name { font-weight: 700; font-size: 15px; }
  .l-meta { font-size: 11.5px; color: var(--faint); margin-top: 1px; }
  .l-price { font-family: var(--font-display); font-weight: 900; font-size: 19px; }
  .l-desc { font-size: 12.5px; color: var(--soft); line-height: 1.45; margin: 8px 0; }
  .l-actions { display: flex; gap: 8px; }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--rc, var(--card2)); color: #fff; }
  .tagpill { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--coral); color: #2A0A0A; margin-left: 4px; }
  .row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 4px 0; }
  .row b { font-weight: 700; } .row .pos { color: var(--good); } .row .neg { color: var(--bad); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ach { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 12.5px; }
  .ach .ic { font-size: 22px; } .ach.lock { opacity: 0.45; filter: grayscale(1); } .ach .d { color: var(--soft); font-size: 11px; }
  .note { font-size: 12.5px; color: var(--soft); line-height: 1.45; }

  /* scene */
  .scene { width: 100%; max-width: 460px; height: 100%; background: var(--bg); border-radius: 22px; display: flex; flex-direction: column; overflow: hidden; animation: pop .25s ease; }
  .scene-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .cp { display: flex; align-items: center; gap: 10px; }
  .cp .big { font-size: 34px; } .cp .mood { font-size: 26px; margin-left: auto; }
  .cp .nm { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
  .say { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; min-height: 44px; }
  .deal { text-align: center; padding: 14px; }
  .deal .st { font-size: 12px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; }
  .deal .pr { font-family: var(--font-display); font-weight: 900; font-size: 38px; }
  .deal .pr.drop { animation: dropp .5s ease; }
  @keyframes dropp { 0% { transform: scale(1.15); color: var(--good); } 100% { transform: none; } }
  .deal .was { color: var(--faint); text-decoration: line-through; font-size: 14px; margin-left: 8px; }
  .deal .sv { color: var(--good); font-weight: 700; font-size: 13.5px; min-height: 20px; }
  .read { font-size: 12px; color: var(--soft); line-height: 1.5; background: var(--card2); border-radius: 12px; padding: 8px 12px; }
  .read b { color: var(--ink); }
  .opts { display: flex; flex-direction: column; gap: 7px; }
  .opt { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; text-align: left; color: var(--ink); }
  .opt .ic { font-size: 20px; } .opt .lb { flex: 1; font-size: 13.5px; font-weight: 600; }
  .opt .ht { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .ht.g { background: rgba(24,166,107,0.16); color: var(--good); } .ht.e { background: rgba(245,184,61,0.2); color: #B7861A; } .ht.l { background: rgba(229,72,77,0.15); color: var(--bad); }
  .opt:disabled { opacity: 0.4; }
  .scene-foot { padding: 10px 14px 14px; display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; border-top: 1px solid var(--line); }
  .rounds { text-align: center; font-size: 12px; color: var(--faint); }

  /* celebration */
  .cele { width: 100%; max-width: 380px; text-align: center; background: var(--card); border-radius: 26px; padding: 26px 20px; position: relative; overflow: hidden; animation: pop .35s ease; }
  .cele .big { font-size: 64px; line-height: 1; animation: bounce .6s ease; }
  @keyframes bounce { 0% { transform: scale(0.3) rotate(-10deg); } 60% { transform: scale(1.2) rotate(4deg); } 100% { transform: none; } }
  .cele h2 { font-family: var(--font-display); font-size: 24px; margin: 10px 0 2px; }
  .cele .sub { color: var(--soft); font-size: 13.5px; line-height: 1.45; margin-bottom: 10px; }
  .cele .stamp { display: inline-block; border: 3px solid var(--good); color: var(--good); font-family: var(--font-display); font-weight: 900; font-size: 20px; padding: 4px 14px; border-radius: 10px; transform: rotate(-4deg); margin: 4px 0 10px; }
  .cele.grail { box-shadow: 0 0 0 3px var(--gold), 0 0 40px rgba(245,184,61,0.5); }
  .cele .kv { text-align: left; background: var(--card2); border-radius: 12px; padding: 8px 12px; margin-bottom: 12px; }
  .confetti { position: absolute; top: -10px; font-size: 20px; animation: fall 1.6s ease-in forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(420px) rotate(360deg); opacity: 0; } }

  .toast { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 16px; font-size: 13px; font-weight: 700; z-index: 60; box-shadow: var(--shadow); display: none; max-width: 90%; text-align: center; }
  .toast.on { display: block; animation: pop .3s ease; }

  /* end */
  .end-wrap { padding: 20px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .tier { font-family: var(--font-display); font-weight: 900; font-size: 84px; line-height: 1; text-align: center; color: var(--primary); }
  @media (prefers-reduced-motion: reduce) { .fi, .modal, .scene, .cele, .cele .big, .sheet, .ov.on, .deal .pr.drop { animation: none; } .confetti { display: none; } .bar-fill, .goal .gf { transition: none; } .feed { scroll-behavior: auto; } }

  /* ===== v2 additions ===== */
  :root { --legend: #E0A02E; --rare: #3B7DD8; --flame: #FF7A2F; }
  .top-row { display: flex; align-items: center; justify-content: space-between; }
  .icon-btn { background: var(--card); border: 1px solid var(--line); border-radius: 12px; width: 38px; height: 38px; font-size: 17px; color: var(--ink); }
  .grid3 { display: grid !important; grid-template-columns: repeat(3, 1fr); }
  .chip.locked { opacity: 0.5; filter: grayscale(0.6); position: relative; }
  .chip .lk { font-size: 10px; font-weight: 800; color: var(--primary); }
  .title-wrap { padding-bottom: 28px; }

  .rankc { display: flex; flex-direction: column; gap: 6px; }
  .rk-top { display: flex; align-items: center; gap: 10px; }
  .rk-badge { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--coral)); color: #fff; font-family: var(--font-display); font-weight: 900; font-size: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 rgba(0,0,0,0.2); }
  .rk-name { font-family: var(--font-display); font-weight: 800; font-size: 16px; line-height: 1.1; }
  .rk-sub { font-size: 11.5px; color: var(--soft); }
  .rk-bar { height: 8px; background: var(--card2); border-radius: 6px; overflow: hidden; }
  .rk-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--coral)); border-radius: 6px; transition: width .6s ease; }
  .rk-next { font-size: 11.5px; color: var(--soft); }
  .rk-next b { color: var(--ink); }

  .daily { background: linear-gradient(135deg, var(--primary), #B14DF6); color: #fff; border: none; display: flex; flex-direction: column; gap: 8px; }
  .daily .dh { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.95; }
  .daily .streak { background: rgba(255,255,255,0.2); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 800; letter-spacing: 0; text-transform: none; }
  .daily .dt { font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.15; }
  .daily .dd { font-size: 12.5px; opacity: 0.9; line-height: 1.4; }
  .daily .btn { background: #fff; color: #3B1FB8; box-shadow: 0 3px 0 rgba(0,0,0,0.25); }
  .daily .btn.ghost { background: rgba(255,255,255,0.18); color: #fff; box-shadow: none; border-color: rgba(255,255,255,0.35); }
  .daily .done { display: flex; align-items: center; gap: 12px; }
  .daily .gl { width: 54px; height: 54px; border-radius: 14px; background: rgba(255,255,255,0.2); font-family: var(--font-display); font-weight: 900; font-size: 32px; display: flex; align-items: center; justify-content: center; }
  .daily .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .three { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* header extras */
  .perks { display: none; gap: 5px; flex-wrap: wrap; }
  .perks.on { display: flex; }
  .pk { font-size: 15px; width: 30px; height: 30px; border-radius: 9px; background: var(--card); border: 2px solid var(--rc, var(--line)); display: flex; align-items: center; justify-content: center; padding: 0; color: var(--ink); }

// ---------- negotiation scenes ----------
function makeCp(kind, rng) {

  const t = ['facts', 'rapport', 'ask', 'leverage'];
  const sh = shuffleR(rng, t);

function leverageBonus(l, scene) {

  if (scene.kind === 'sell') return 0.06;

}
function tacticBase(l, scene, id) {

  else if (id === 'facts') p = 0.48 + (smarts - 50) / 150;
  else if (id === 'rapport') p = 0.48 + (charm - 50) / 150;
  else if (id === 'leverage') p = 0.40 + leverageBonus(l, scene);
  else p = 0.30 + (charm - 50) / 250;
  if (id === 'rapport' && hasPerk(l, 'silver')) p += 0.12;
  if (id === 'facts' && hasPerk(l, 'numbers')) p += 0.12;
  if (id === 'ask' && hasPerk(l, 'blunt')) p += 0.12;
  if (id === 'leverage' && hasPerk(l, 'closer')) p += 0.12;
  if (id === 'bluff' && hasPerk(l, 'poker')) p += 0.10;
  if (hasPerk(l, 'golden')) p += 0.08;
  if (l.flags.beginner && l.haggle.scenes < 2) p += 0.12;
  return clamp(p + (l.haggle.level - 1) * 0.02 - scene.round * 0.03, 0.08, 0.9);
}
function tacticChance(l, scene, id, withTrait) {
  let p = tacticBase(l, scene, id);
  if (withTrait) { if (scene.cp.likes === id) p += 0.18; if (scene.cp.dislikes === id) p -= 0.22; }
  return clamp(p, 0.05, 0.92);
}
function hintLabel(p) { return p >= 0.62 ? 'Good odds' : p >= 0.45 ? 'Even odds' : 'Long shot'; }
function sceneOptions(l, scene) {
  return ['ask', 'facts', 'rapport', 'leverage', 'bluff'].map(id => {
    const p = tacticChance(l, scene, id, false);

// kind: shop|car|home|rent (buy, price goes DOWN) | salary|sell (price goes UP)

  const start = spec.start;
  const limit = down ? start * rr(rng, spec.floor[0], spec.floor[1]) : start * rr(rng, spec.ceil[0], spec.ceil[1]);
  return {

    dir: down ? 'down' : 'up', start, current: start, limit, maxRounds: 4 + (hasPerk(l, 'gab') ? 1 : 0), round: 0, patience: 100, combo: 0, maxCombo: 0, rolls: [], rerolled: false, gambled: false, gambleWon: false,

const SCENE_RANGE = { ask: [0.20, 0.35], facts: [0.25, 0.40], rapport: [0.18, 0.32], leverage: [0.28, 0.45], bluff: [0.40, 0.65] };
const SCENE_PAT = { ask: [16, 24], facts: [12, 20], rapport: [8, 16], leverage: [14, 22], bluff: [30, 45] };
const comboCap = l => hasPerk(l, 'golden') ? 0.70 : 0.45;
function sceneStep(l, scene, id, rng) {

function addItemToCloset(l, listing, paid) {

  };

}
function raiseScene(l, rng) {
  const base = Math.round(l.salary * 1.01);
  const apply = (life, price) => { life.salary = Math.min(Math.round(price / 100) * 100, Math.round(190000 * life.priceIndex)); life.raiseAskAge = life.age; fx(life, { happy: 5 }); return { ok: true, kind: 'raise', price, text: 'Your new salary starts this month.' }; };
  const s = startScene(l, { kind: 'salary', title: 'Raise review', subject: 'Your annual raise', desc: 'Your manager has a number in mind. You have a better one.', start: base, ceil: [1.0, 1.0], apply }, rng);
  s.limit = l.salary * rr(rng, 1.04, 1.04 + clamp((l.perf - 40) / 500, 0.01, 0.10));
  s.meta = { raise: true };
  return s;
}
function sellScene(l, kind, ref, rng, opts) {
  opts = opts || {};
  const value = kind === 'car' ? l.car.value : ref.value;
  const start = round5(value * rr(rng, 0.70, 0.82) * (hasPerk(l, 'flipper') ? 1.08 : 1) * (1 + (opts.premium || 0)));
  const apply = (life, price) => {
    if (kind === 'car') { life.car = null; } else { life.wardrobe = life.wardrobe.filter(i => i !== ref); }
    life.cash += price;
    if (price > ref.paid) life.flags.flipProfit = (life.flags.flipProfit || 0) + (price - ref.paid);
    fx(life, { happy: -2 });
    return { ok: true, kind: 'sold', price, text: 'Sold.' };
  };
  return startScene(l, { kind: 'sell', title: 'Selling: ' + ref.name, subject: ref.name, desc: ref.desc, start, ceil: [1.06, 1.22], apply, floor: null }, rng);
}

// ---------- yearly engine ----------
function incomeAndCosts(l) {
  const idx = l.priceIndex, gross = l.salary;
  const net = gross * (1 - taxRate(gross));
  const pIncome = partnerActive(l) ? l.partner.income * (1 - taxRate(l.partner.income)) : 0;
  const living = (19000 * idx + l.kids * 7500 * idx + (partnerActive(l) ? 8500 * idx : 0) + (l.pet ? 1200 : 0)) * (hasPerk(l, 'frugal') ? 0.92 : 1);
  const side = hasPerk(l, 'hustle') ? 1800 * idx : 0;
  let housing = 0;
  if (l.housing === 'family') housing = 4200;
  else if (l.housing === 'rent') housing = l.rent;
  else if (l.home) housing = l.home.payment + l.home.value * 0.012;
  const car = l.car ? 4500 * idx : 2000;
  const debtPay = l.debt > 0 ? Math.min(l.debt, Math.max(2400, l.debt * 0.08)) : 0;
  const ret = l.contributing ? gross * 0.06 : 0;
  return { gross, net, pIncome, side, living, housing, car, debtPay, ret };
}

function ageUp(l, rng) {
  const lines = [];
  l.age += 1;
  l.priceIndex *= 1.025;
  if (l.partner) l.partner.years += 1;
  l.yearsInRole += 1;
  if (l.job) {
    l.perf = clamp(l.perf + rr(rng, -3, 3) + (l.stats.happy > 60 ? 1 : -1) + (l.stats.smarts - 55) / 40, 15, 98);
    const raise = 0.015 + l.perf / 100 * 0.015;
    l.salary = Math.min(Math.round(l.salary * (1 + raise) / 100) * 100, Math.round(190000 * l.priceIndex));
  }
  const f = incomeAndCosts(l);
  const interest = l.cash * 0.015;
  const spend = f.living + f.housing + f.car + f.debtPay + f.ret;
  const flow = f.net + f.pIncome + f.side + interest - spend;
  const before = l.cash;
  l.cash += flow;
  l.debt = Math.max(0, (l.debt - f.debtPay) * 1.07);
  if (l.contributing) l.retirement += f.gross * 0.09;
  l.retirement = Math.max(0, l.retirement * (1 + 0.07 + (hasPerk(l, 'investor') ? 0.02 : 0) + rr(rng, -0.12, 0.14) * (hasPerk(l, 'investor') ? 0.6 : 1)));
  if (l.cash < 0) { l.debt += -l.cash; l.cash = 0; l.credit = clamp(l.credit - 15, 400, 830); lines.push('⚠️ You ran short and borrowed to cover bills.'); }
  else l.credit = clamp(l.credit + 3, 400, 830);
  if (l.home) {
    const interestPaid = l.home.loan * l.home.rate;
    l.home.loan = Math.max(0, l.home.loan - (l.home.payment - interestPaid));
    l.home.value *= 1 + 0.03 + rr(rng, -0.025, 0.045);
  }
  if (l.car) l.car.value *= 0.88;
  l.wardrobe.forEach(i => { i.value = Math.max(10, i.value * (1 + i.appr + (hasPerk(l, 'collector') ? 0.02 : 0))); });
  // stats drift
  const comfort = clamp((flow / Math.max(20000, f.gross)) * 20, -12, 12);
  const own = Math.min(10, l.wardrobe.reduce((s, i) => s + RARITY[i.rarity].happy, 0) * 0.4);
  const target = 46 + comfort + (l.partner ? 7 : 0) + (l.home ? 4 : 0) + (l.car ? 2 : 0) + own + (l.kids ? 3 : 0) - (l.flags.overdraft ? 10 : 0);
  l.stats.happy = clamp(l.stats.happy + (target - l.stats.happy) * 0.25 + rr(rng, -2, 2), 0, 100);
  l.stats.health = clamp(l.stats.health - (l.age > 38 ? rr(rng, 0.8, 1.6) : rr(rng, 0, 0.7)) + (l.pet ? 0.3 : 0), 0, 100);
  if (l.job) l.stats.smarts = clamp(l.stats.smarts + 0.3, 0, 100);
  l.flags.overdraft = false;
  l.lastYear = { net: flow, income: f.net + f.pIncome + f.side, spend, age: l.age };
  l.curve[l.age] = Math.round(netWorth(l));
  lines.unshift((flow >= 0 ? '💵 Saved ' : '📉 Lost ') + money(Math.abs(flow)) + ' this year (' + money(f.net + f.pIncome + f.side) + ' in, ' + money(spend) + ' out).');
  // ending conditions
  const mortality = l.age > 55 ? (l.age - 55) * 0.0025 * (l.stats.health < 40 ? 3 : 1) : 0;
  if (l.stats.health <= 0 || rng() < mortality) { l.alive = false; l.deathCause = l.stats.health <= 0 ? 'health' : 'natural'; return { lines, ended: 'death', event: null }; }
  if (l.age >= END_AGE) return { lines, ended: 'retire', event: null };
  return { lines, ended: null, event: pickEvent(l, rng), talent: [30, 40, 50].indexOf(l.age) >= 0 };
}

function pickEvent(l, rng) {
  const eligible = EVENTS.filter(e => l.age >= e.minAge && l.age <= e.maxAge && e.when(l) && (l.last[e.id] === undefined || l.age - l.last[e.id] >= e.cd));
  const forced = eligible.find(e => e.forced);
  if (forced) return instantiate(forced, l, rng);
  if (rng() < 0.12) return null;
  const pool = eligible.filter(e => !e.forced);
  if (!pool.length) return null;
  const total = pool.reduce((s, e) => s + e.w, 0);
  let r = rng() * total;
  for (const e of pool) { r -= e.w; if (r <= 0) return instantiate(e, l, rng); }
  return instantiate(pool[0], l, rng);
}
function instantiate(e, l, rng) {
  l.last[e.id] = l.age;
  let choices;
  if (e.choicesFrom) { const g = e.gen(l, rng); choices = e.choicesFrom(l, rng, g); }
  else choices = e.choices.map(c => ({ label: c.label, sub: typeof c.sub === 'function' ? c.sub(l) : c.sub, run: c.run }));
  return { id: e.id, emoji: e.emoji, title: e.title(l), text: e.text(l), choices };
}

function rollPerks(l, rng, rank, n) {

    const tot = rars.reduce((s, r) => s + PERK_RAR[r].w, 0);
    let x = rng() * tot, rar = rars[0];
    for (const r of rars) { x -= PERK_RAR[r].w; if (x <= 0) { rar = r; break; } }

    const ch = cands[Math.floor(rng() * cands.length)];
    out.push(ch); pool = pool.filter(p => p !== ch);

}

    const rk = rank(), n = draftSize(rk);
    let offer = rollPerks(life, rng, rk, n);
    if (!offer.length) { resolve(); return; }
    function paint() {
      showModalHTML(`<div class="em">🧩</div><h2>${esc(title)}</h2><p>${esc(sub)}</p><div class="draft" id="dr"></div>${life.flags.rerolls > 0 ? `<button class="btn btn-ghost" id="drRe" style="margin-top:10px">🎲 Reroll offers (${life.flags.rerolls} left)</button>` : ""}`);
      offer.forEach(p => {
        const R = PERK_RAR[p.rar], b = document.createElement("button");
        b.className = "dcard " + p.rar; b.style.setProperty("--rc", R.color);
        b.innerHTML = `<span class="e">${p.icon}</span><span><div class="r">${R.label}</div><div class="n">${esc(p.name)}</div><div class="d">${esc(p.desc)}</div></span>`;
        b.addEventListener("click", () => {
          life.perks.push(p.id); sfx(p.rar === "legendary" ? "level" : "win"); buzz(25);
          closeOv("ovModal");
          feedItem(`${p.icon} <b>Talent gained: ${esc(p.name)}.</b> ${esc(p.desc)}`, "gold");
          persistLife(); renderHead(); resolve();
        });
        $("dr").appendChild(b);
      });
      const re = $("drRe");
      if (re) re.addEventListener("click", () => { life.flags.rerolls -= 1; offer = rollPerks(life, rng, rk, n); sfx("tap"); paint(); });
    }
    paint();
  });
}

}

// ---------- feed ----------
function feedItem(html, cls) {
  const d = document.createElement("div"); d.className = "fi " + (cls || ""); d.innerHTML = html; $("feed").appendChild(d);
  const f = $("feed"); f.scrollTop = f.scrollHeight;
}
function feedYear() {
  const d = document.createElement("div"); d.className = "yr";
  d.innerHTML = `<span class="a">Age ${life.age}</span><span class="w">Net worth ${money(netWorth(life))}</span>`;
  $("feed").appendChild(d);
}
function paceItem() {
  const bc = save.bestCurve;
  if (!bc || life.age < 24) return;
  const b = bc[life.age];
  if (b === undefined) return;
  const d = netWorth(life) - b;
  if (Math.abs(d) < 500) return;
  feedItem(d > 0 ? `📈 <b>${short(d)} ahead</b> of your best life at this age.` : `📉 <b>${short(-d)} behind</b> your best life at this age.`, "pace " + (d > 0 ? "up" : "down"));
}
function chipsFor(before) {
  const now = snap(life), out = [];
  [["health", "❤️"], ["happy", "😊"], ["smarts", "🧠"], ["charm", "✨"]].forEach(([k, ic]) => { const d = Math.round(now[k] - before[k]); if (d) out.push([`${ic} ${d > 0 ? "+" : ""}${d}`, d > 0]); });
  const dc = Math.round(now.cash - before.cash); if (dc) out.push([`💵 ${dc > 0 ? "+" : "-"}${money(Math.abs(dc))}`, dc > 0]);
  const dd = Math.round(now.debt - before.debt); if (dd) out.push([`🧾 debt ${dd > 0 ? "+" : "-"}${money(Math.abs(dd))}`, dd < 0]);
  return out.map(([t, pos]) => `<span class="dchip ${pos ? "pos" : "neg"}">${t}</span>`).join("");
}

  return new Promise(resolve => {
    showModalHTML(`<div class="em">${ev.emoji}</div><h2>${esc(ev.title)}</h2><p>${esc(ev.text)}</p><div class="choices" id="evChoices"></div>`);
    const box = $("evChoices");
    ev.choices.forEach(c => {
      const b = document.createElement("button"); b.className = "choice";
      b.innerHTML = `<div class="t">${esc(c.label)}</div>${c.sub ? `<div class="s">${esc(c.sub)}</div>` : ""}`;
      b.addEventListener("click", async () => {
        sfx("tap");
        const before = snap(life);
        const res = c.run(life, rng) || {};
        if (res.scene) {
          closeOv("ovModal");
          const r = await runScene(res.scene);
          if (r && r.walked && ev.id === "jobOffers") feedItem("You walked away from the offer. Rent does not wait, though.", "bad");
          resolve(); return;
        }
        feedItem(`${ev.emoji} <b>${esc(endp(ev.title))}</b> ${esc(res.text || "")}`, "");
        showModalHTML(`<div class="em">${ev.emoji}</div><h2>${esc(ev.title)}</h2><p>${esc(res.text || "")}</p><div class="delta">${chipsFor(before)}</div><button class="btn btn-primary" id="evOk">Continue</button>`);
        $("evOk").addEventListener("click", () => {
          closeOv("ovModal"); renderHead();
          if (res.openShop) { shopTab = res.openShop; openSheet("shop"); }

        });
      });
      box.appendChild(b);
    });

}

// ---------- scenes (negotiation) ----------
function runScene(scene, o) {
  o = o || {};
  return new Promise(resolve => {
    sceneCtx = { scene, resolve, last: "", drop: false, delta: 0, shakeSay: false, shakeAll: false, locked: false, L: o.life || life, rng: o.rng || rng, daily: !!o.daily };
    renderScene();
    openOv("ovScene"); sfx("tap");
  });
}
function priceText(scene, v) { return scene.unit === "mo" ? `${money(v)}/mo` : money(v); }
const GRADE_TXT = { S: "Perfect read", A: "Sharp deal", B: "Solid deal", C: "Decent, not great", D: "They had your number" };
function renderScene() {
  const ctx = sceneCtx, scene = ctx.scene, L = ctx.L;
  const finalNow = scene.final || scene.over;
  const saved = sceneSaved(scene);
  const opts = sceneOptions(L, scene);
  const radar = hasPerk(L, "radar"), oracle = hasPerk(L, "oracle");
  const kindLabel = { shop: "Price", car: "Price", home: "Asking price", rent: "Rent", salary: "Offer", sell: "Their offer" }[scene.kind];
  const goodWord = scene.dir === "down" ? "Saved" : "Gained";
  const pat = clamp(scene.patience, 0, 100), patCol = pat > 66 ? "var(--good)" : pat > 33 ? "var(--gold)" : "var(--bad)";
  const nextMult = Math.round(Math.min(comboCap(L), 0.15 * scene.combo) * 100);
  const comboHtml = scene.combo >= 2 ? `<span class="combo ${scene.combo >= 4 ? "c4" : scene.combo >= 3 ? "c3" : ""}">🔥 x${scene.combo} combo${nextMult ? ` · +${nextMult}% next` : ""}</span>` : (scene.combo === 1 ? `<span class="note">One more win starts a combo</span>` : `<span class="note"></span>`);
  const canGamble = scene.final && !scene.over && !scene.gambled;
  const gp = canGamble ? gambleOdds(L, scene) : 0;
  $("scene").innerHTML = `
    <div class="scene-body">
      <div class="cp"><div class="big">${scene.cp.emoji}</div><div><div class="nm">${esc(scene.cp.name)}</div><div class="note">${esc(scene.title)}</div></div><div class="mood">${sceneMood(scene)}</div></div>
      <div class="say" id="scSay">${esc(ctx.last || scene.desc)}</div>
      <div class="card deal"><div class="st">${kindLabel}</div>
        <div><span class="pr ${ctx.drop ? "drop" : ""}" id="scPrice">${priceText(scene, Math.round(scene.current))}</span>${saved > 0 ? `<span class="was">${priceText(scene, scene.start)}</span>` : ""}</div>
        <div class="sv">${saved >= 1 ? `${goodWord} ${priceText(scene, Math.round(saved))}` : ""}</div></div>
      <div class="pat ${pat <= 33 ? "low" : ""}"><span>Patience</span><div class="pb"><i style="width:${pat}%;background:${patCol}"></i></div><span class="rollrow">${scene.rolls.join("")}</span></div>
      <div class="strip">${comboHtml}<span class="rounds" style="text-align:right">${finalNow ? (scene.over ? "They have walked out." : "Final offer.") : `Round ${scene.round + 1} of ${scene.maxRounds}`}</span></div>
      <div class="read"><b>Read the room:</b><br>👍 ${esc(scene.cp.clueLike)}<br>👎 ${esc(scene.cp.clueDislike)}</div>
      ${canGamble ? `<div class="gamble"><div class="gt">🎰 Go for broke?</div><div class="gs">One last push for a much better number. About <b>${Math.round(gp * 100)}%</b> they blink. Otherwise they walk and the deal is gone.</div><button id="scGamble">Push my luck</button></div>` : ""}
      <div class="opts">${opts.map(o => {
        const trait = scene.cp.likes === o.id ? "liked" : scene.cp.dislikes === o.id ? "disl" : "";
        const mark = radar && trait ? `<span class="mk">${trait === "liked" ? "👍" : "👎"}</span>` : "";
        const hint = oracle ? `${Math.round(tacticChance(L, scene, o.id, true) * 100)}%` : o.hint;
        const hc = oracle ? (tacticChance(L, scene, o.id, true) >= 0.62 ? "g" : tacticChance(L, scene, o.id, true) >= 0.45 ? "e" : "l") : (o.hint === "Good odds" ? "g" : o.hint === "Even odds" ? "e" : "l");
        return `<button class="opt ${radar ? trait : ""}" data-t="${o.id}" ${finalNow ? "disabled" : ""}><span class="ic">${o.icon}</span><span class="lb">${esc(o.label)}</span>${mark}<span class="ht ${hc}">${hint}</span></button>`;
      }).join("")}</div>
    </div>
    <div class="scene-foot"><button class="btn btn-ghost" id="scWalk">Walk away</button><button class="btn btn-primary" id="scAccept" ${scene.over ? "disabled" : ""}>Accept ${priceText(scene, Math.round(scene.current))}</button></div>`;
  if (ctx.drop && ctx.delta >= 1) { const f = document.createElement("div"); f.className = "float"; f.textContent = (scene.dir === "down" ? "-" : "+") + priceText(scene, Math.round(ctx.delta)); $("scene").querySelector(".deal").appendChild(f); }
  if (ctx.shakeSay) $("scSay").classList.add("shake");
  if (ctx.shakeAll && !REDUCED) { $("scene").classList.remove("shake"); void $("scene").offsetWidth; $("scene").classList.add("shake"); }
  ctx.drop = false; ctx.delta = 0; ctx.shakeSay = false; ctx.shakeAll = false;
  $("scene").querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => sceneTactic(b.dataset.t)));
  $("scWalk").addEventListener("click", () => { if (sceneCtx && !sceneCtx.locked) { sceneCtx.locked = true; endScene({ ok: false, walked: true }); } });
  $("scAccept").addEventListener("click", sceneAccept);
  const g = $("scGamble"); if (g) g.addEventListener("click", sceneGambleClick);
}
function sceneTactic(id) {
  const ctx = sceneCtx;
  if (!ctx || ctx.locked) return;
  const { scene, L } = ctx;
  const r = sceneStep(L, scene, id, ctx.rng);
  if (!r) return;
  ctx.last = `${TACTIC_ICON[id]} ${r.text}${r.lucky ? " 🍀 Lucky Streak saved that one." : ""}`;
  ctx.drop = r.ok; ctx.delta = r.ok ? r.delta : 0; ctx.shakeSay = !r.ok;
  if (r.ok) { sfx("combo", r.combo); buzz(15); } else { sfx("fail"); buzz([30, 40, 30]); }
  if (scene.over) { sfx("walk"); ctx.shakeAll = true; buzz(90); }
  renderScene();
}
function sceneGambleClick() {
  const ctx = sceneCtx;
  if (!ctx || ctx.locked) return;
  const { scene, L } = ctx;
  sfx("gamble");
  const r = sceneGamble(L, scene, ctx.rng);
  if (!r) return;
  ctx.last = `🎰 ${r.text}`;
  const go = () => {
    if (!sceneCtx) return;
    ctx.drop = r.ok; ctx.delta = r.ok ? r.delta : 0; ctx.shakeAll = !r.ok; ctx.shakeSay = !r.ok;
    if (r.ok) { sfx("win"); buzz([20, 30, 20]); } else { sfx("walk"); buzz(100); }
    renderScene();
  };
  if (FAST) go(); else setTimeout(go, 650);
}
async function sceneAccept() {
  const ctx = sceneCtx;
  if (!ctx || ctx.locked) return;
  ctx.locked = true;
  const { scene, L } = ctx;
  const res = finishScene(L, scene, true, ctx.rng, {});
  if (res.ok) {
    if (ctx.daily) { endScene(res); return; }
    await celebrate(res, scene); endScene(res); return;
  }
  await handleFail(res, scene);
  if (sceneCtx === ctx) ctx.locked = false;
}
function handleFail(res, scene) {
  return new Promise(resolve => {
    let msg = "", btns = [];
    if (res.reason === "funds") {
      msg = `You are ${money(res.shortfall)} short for this one.`;
      if (res.canCredit) btns.push(["Put it on credit", "Adds debt with interest and dents your credit score", async () => { const r2 = finishScene(life, scene, true, rng, { credit: true }); closeOv("ovModal"); if (r2.ok) { await celebrate(r2, scene); endScene(r2); } resolve(); }]);
    } else if (res.reason === "down") msg = `The bank wants a down payment plus closing costs. You need about ${money(res.need)} in cash.`;
    else if (res.reason === "dti") msg = `The lender says the payment (about ${money(res.pay)}/yr) is too high for your income.`;
    else if (res.reason === "full") msg = `Your closet is full (${res.cap} pieces). Sell something first, or move somewhere bigger.`;
    btns.push(["Back to the deal", "Keep negotiating", () => { closeOv("ovModal"); resolve(); }]);
    btns.push(["Walk away", "", () => { closeOv("ovModal"); endScene({ ok: false, walked: true }); resolve(); }]);
    showModalHTML(`<div class="em">⚠️</div><h2>Not quite</h2><p>${esc(msg)}</p><div class="choices" id="failChoices"></div>`);
    btns.forEach(([t, s, fn]) => { const b = document.createElement("button"); b.className = "choice"; b.innerHTML = `<div class="t">${esc(t)}</div>${s ? `<div class="s">${esc(s)}</div>` : ""}`; b.addEventListener("click", fn); $("failChoices").appendChild(b); });
  });
}
function endScene(res) {
  closeOv("ovScene");
  const ctx = sceneCtx; sceneCtx = null;
  if (ctx) { if (!ctx.daily && ctx.scene.meta && ctx.scene.meta.raise) life.raiseAskAge = life.age; ctx.resolve(res); }
  if (ctx && ctx.daily) return;
  renderHead(); afterAction(); persistLife();
  if ($("ovSheet").classList.contains("on")) renderSheet();
  flushRankUps();
}

// ---------- collection ----------
function discover(it) {
  const key = life.style + ":" + it.name;
  if (save.collection[key]) return false;
  save.collection[key] = { r: it.rarity, s: life.style, age: life.age };
  gainXP({ common: 5, rare: 10, grail: 25 }[it.rarity]);
  const cat = CATALOGS[life.style], sk = life.style + ":" + it.rarity;
  if (cat.filter(c => c.rarity === it.rarity).every(c => save.collection[life.style + ":" + c.name]) && !save.galleryDone[sk]) {
    save.galleryDone[sk] = 1;
    const bonus = { common: 100, rare: 200, grail: 400 }[it.rarity];
    gainXP(bonus);
    toast(`📖 Set complete: ${RARITY[it.rarity].label} ${STYLE_META[life.style].word} · +${bonus} XP`);
  }
  persist();
  return true;
}

// ---------- celebration ----------
function celebrate(res, scene) {
  return new Promise(resolve => {
    let big = "🎉", title = "Deal done", sub = res.text || "", rar = "", kv = "", grail = false, isNew = false;
    const saved = Math.round(res.saved || 0);
    if (res.kind === "item") {
      const it = res.item, R = RARITY[it.rarity]; big = styleEmoji(); title = it.name; grail = it.rarity === "grail";
      isNew = discover(it);
      sub = it.desc; rar = `<span class="badge" style="--rc:${R.color}">${R.label}</span>${isNew ? `<span class="newtag">NEW IN COLLECTION</span>` : ""}`;
      kv = `<div class="row"><span>You paid</span><b>${money(res.price)}</b></div><div class="row"><span>Market value</span><b>${money(res.value)}</b></div>` + (res.value > res.price ? `<div class="row"><span>Instant equity</span><b class="pos">+${money(res.value - res.price)}</b></div>` : "") + `<div class="row"><span>Happiness / charm</span><b class="pos">+${R.happy} / +${R.charm}</b></div>` + (res.onCredit ? `<div class="row"><span>Put on credit</span><b class="neg">${money(res.onCredit)}</b></div>` : "");
    } else if (res.kind === "car") { big = "🚗"; title = life.car.name; sub = life.car.desc; kv = `<div class="row"><span>You paid</span><b>${money(res.price)}</b></div><div class="row"><span>Market value</span><b>${money(res.value)}</b></div>`; }
    else if (res.kind === "home") { big = "🏠"; title = "You own " + life.home.name; sub = life.home.desc; kv = `<div class="row"><span>Price</span><b>${money(res.price)}</b></div><div class="row"><span>Down payment</span><b>${money(res.down)}</b></div><div class="row"><span>Mortgage</span><b>${money(res.loan)} at ${(res.rate * 100).toFixed(1)}%</b></div><div class="row"><span>Payment</span><b>${money(res.payment / 12)}/mo</b></div>`; }
    else if (res.kind === "rent") { big = "🗝️"; title = "Lease signed"; sub = life.homeName + ": " + life.homeDesc; kv = `<div class="row"><span>Rent</span><b>${money(res.price)}/mo</b></div>`; }
    else if (res.kind === "job") { big = "💼"; title = "You got the job"; sub = `${life.job}, starting at ${money(life.salary)} a year.`; }
    else if (res.kind === "raise") { big = "📈"; title = "Raise approved"; sub = `Your salary is now ${money(life.salary)}.`; }
    else if (res.kind === "sold") { big = "🏷️"; title = "Sold"; sub = `You walked away with ${money(res.price)}.`; }
    const g = res.grade, xp = GRADE_XP[g.letter];
    gainXP(xp);
    const unit = scene.unit === "mo" ? "mo" : "";
    const pt = v => priceText({ unit }, Math.round(v));
    const gx = g.letter === "S" ? "Not a dollar left on the table." : scene.dir === "down" ? `They would have gone as low as <b>${pt(res.floor)}</b>. You left <b>${pt(g.left)}</b> on the table.` : `They would have gone as high as <b>${pt(res.floor)}</b>. You left <b>${pt(g.left)}</b> on the table.`;
    const gradeBox = `<div class="gradebox"><div class="gl g-${g.letter}">${g.letter}</div><div><div class="gt">${GRADE_TXT[g.letter]}${res.gambleWon ? " · 🎰 gamble paid off" : ""}</div><div class="gx">${gx}</div><div class="rollrow">${esc((res.rolls || []).join(""))}</div></div></div>`;
    $("cele").className = "cele" + (grail ? " grail" : "") + (g.letter === "S" ? " sgrade" : "");
    $("cele").innerHTML = `<div class="big">${big}</div><h2>${esc(title)}</h2>${rar}<div class="sub" style="margin-top:6px">${esc(sub)}</div>${saved >= 1 ? `<div class="stamp">${res.kind === "job" || res.kind === "raise" || res.kind === "sold" ? "+" : "SAVED "}${money(saved)}${res.kind === "job" || res.kind === "raise" ? "/yr" : ""}</div>` : ""}${gradeBox}<div class="xpline">+${xp} XP</div>${kv ? `<div class="kv">${kv}</div>` : ""}<button class="btn btn-primary" id="celeOk">Nice!</button>`;
    openOv("ovCele"); confetti($("cele"), g.letter === "S" ? 34 : grail ? 24 : 14);
    sfx(g.letter === "S" || g.letter === "A" ? "level" : "coin"); buzz(g.letter === "S" ? [30, 40, 30, 40, 60] : 25);
    const label = res.kind === "item" ? `bought <b>${esc(res.item.name)}</b> for ${money(res.price)}` : res.kind === "home" ? `bought <b>${esc(life.home.name)}</b> for ${money(res.price)}` : res.kind === "car" ? `bought a <b>${esc(life.car.name)}</b> for ${money(res.price)}` : res.kind === "rent" ? `signed a lease on <b>${esc(life.homeName)}</b> at ${money(res.price)}/mo` : res.kind === "job" ? `started as <b>${esc(life.job)}</b> at ${money(life.salary)}/yr` : res.kind === "raise" ? `negotiated a raise to <b>${money(life.salary)}</b>` : `sold for ${money(res.price)}`;
    feedItem(`🛍️ You ${label}. <b>Grade ${g.letter}.</b>${saved >= 1 ? ` Negotiated ${money(saved)} in your favor.` : ""}`, g.letter === "D" ? "" : "good");
    if (life.goal && ((res.kind === "home" && life.goal.cat === "home") || (res.kind === "item" && life.goal.name === res.item.name) || (res.kind === "car" && life.goal.cat === "car"))) { life.goal = null; }
    $("celeOk").addEventListener("click", () => { closeOv("ovCele"); resolve(); });
  });
}

function checkNW() {

    toast(`💰 ${short(NW_MILESTONES[i])} net worth!`); feedItem(`💰 <b>${short(NW_MILESTONES[i])} net worth.</b> Milestone reached.`, "gold"); gainXP(10); sfx("coin"); i++;
  }

}
async function ageUpClick() {
  if (busy) return;

  const out = ageUp(life, rng);

}
function afterAction() {
  const fresh = checkAchievements(life);

}

}

  save.life = null;
  const headline = lifeHeadline(life);
  const xp = Math.round(sc.total / 12) + (retired ? 30 : 0);
  gainXP(xp);
  persist();
  const heir = makeHeir(life);
  lastEnd = { name: life.name, heir };
  $("endKicker").textContent = retired ? `${life.name} retires at ${life.age}` : `${life.name} passed away at ${life.age}`;
  $("endTier").textContent = sc.tier;
  $("endHead").textContent = `"${headline}"`;
  $("endCard").innerHTML = `<div class="row"><span>Final score</span><b>${sc.total}</b></div><div class="row"><span>Net worth</span><b>${money(netWorth(life))}</b></div><div class="row"><span>Happiness</span><b>${Math.round(life.stats.happy)}</b></div><div class="row"><span>Achievements</span><b>${Object.keys(life.achievements).length}/${ACHIEVEMENTS.length}</b></div>${isBest ? `<div class="note" style="margin-top:6px">🏆 Your best life yet. It is now the ghost you race next time.</div>` : `<div class="note" style="margin-top:6px">Best life: ${save.best}. You were ${save.best - sc.total} points short.</div>`}`;
  const rk = rank(), cur = rankXP(rk), nxt = rankXP(rk + 1), pct = rk >= 12 ? 100 : Math.round(clamp((save.xp - cur) / (nxt - cur), 0, 1) * 100), un = nextUnlock(rk);
  $("endXP").innerHTML = `<div class="row"><span>XP earned this life</span><b class="pos">+${xp}</b></div><div class="row"><span>Rank</span><b>${rk} · ${esc(RANK_TITLES[rk - 1])}</b></div><div class="xpbar"><i style="width:${pct}%"></i></div>${un ? `<div class="note" style="margin-top:6px">🔒 Rank ${un.rank} unlocks: ${esc(un.text)}</div>` : ""}`;
  $("endParts").innerHTML = `<div class="label" style="margin-bottom:6px">Score breakdown</div>` + sc.parts.map(p => `<div class="row"><span>${p.label}</span><b>${p.pts}</b></div>`).join("");
  const stuff = [];
  if (life.home) stuff.push(`🏠 ${esc(life.home.name)} (${money(life.home.value)})`);
  if (life.car) stuff.push(`🚗 ${esc(life.car.name)}`);
  life.wardrobe.forEach(i => stuff.push(`${styleEmoji()} ${esc(i.name)} · ${RARITY[i.rarity].label}`));
  $("endStuff").innerHTML = `<div class="label" style="margin-bottom:6px">What you own</div>` + (stuff.length ? stuff.map(s => `<div class="row"><span>${s}</span></div>`).join("") : `<div class="note">Not much, but a lot of memories.</div>`);
  $("heirBtn").innerHTML = `Play as ${esc(life.name.replace(/ Jr\.$/, "").slice(0, 10))} Jr.<br><span style="font-size:12px;font-weight:600;opacity:0.9">+${money(heir.cash)} head start${heir.heirloom ? ` and the ${esc(heir.heirloom.name)}` : ""}</span>`;
  lastEnd.text = lifeShare(sc, retired, headline);
  showView("view-end");
  sfx(sc.tier === "S" || sc.tier === "A" ? "level" : "coin");
  flushRankUps();
}

// ---------- events wiring ----------
$("startBtn").addEventListener("click", () => startLife(null));
$("continueBtn").addEventListener("click", continueLife);
$("againBtn").addEventListener("click", () => { $("nameInput").value = ""; renderTitle(); showView("view-title"); });
$("heirBtn").addEventListener("click", () => { if (lastEnd) startLife(lastEnd.heir); });
$("shareBtn").addEventListener("click", () => { if (lastEnd) shareText(lastEnd.text); });
$("dAge").addEventListener("click", ageUpClick);
$("dShop").addEventListener("click", () => { if (busy) return; if (hotAvailable(life).length && life.flags.hotSeen !== life.age) { shopTab = "hot"; life.flags.hotSeen = life.age; } openSheet("shop"); });
$("dAssets").addEventListener("click", () => { if (!busy) openSheet("assets"); });
$("dCareer").addEventListener("click", () => { if (!busy) openSheet("career"); });
$("dLife").addEventListener("click", () => { if (!busy) openSheet("life"); });
$("questStrip").addEventListener("click", () => { if (!busy) openSheet("life"); });
$("sheetClose").addEventListener("click", closeSheet);
$("soundBtn").addEventListener("click", toggleSound);
$("galleryBtn").addEventListener("click", () => openSheet("gallery"));
$("trophyBtn").addEventListener("click", () => openSheet("trophies"));

window.__life = { get life() { return life; }, get save() { return save; }, get busy() { return busy; }, get scene() { return sceneCtx && sceneCtx.scene; }, get lastEnd() { return lastEnd; }, rank };
renderTitle();
})();
</script>
</body>
</html>
